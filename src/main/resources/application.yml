server:
  port: 10800

spring:
  application:
    name: bookstore-api
  profiles.active: dev


  datasource:
    url: jdbc:postgresql://${DB_HOST:saravanjs}:${DB_PORT:5433}/${DB_NAME:bookstoredb}
    username: ${DB_USER:bookstore}
    password: ${DB_PASS:bookstore123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop          # use 'validate' in production; 'update' for POC
    show-sql: true
    properties:
      hibernate:
        format_sql: true
#        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never               # set to 'always' to run data.sql on startup

# SpringDoc / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

dirLog: /data/logs/dxctest

logging:
  file.clean-history-on-start: true
  level:
    root: INFO
    com.bookstore: DEBUG
  pattern:
#    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    console: "%M - %msg%n"
    file: "%msg%n"
  path: ${dirLog}
  file.name: ${dirLog}/dxctest.log

  file.max-size: 100MB
  file.max-history: 15

  pattern.rolling-file-name: ${dirLog}/%d{yyyyMMdd}/dxctest.%d{yyyyMMdd}.%i.log.gz
#  pattern.console: "%d{yyyy-MM-dd HH:mm:ss} | [%thread] | %-5level | %logger{36}.%M - %msg%n"
#  pattern.file: "%d{yyyy-MM-dd HH:mm:ss} | [%thread] | %-5level | %logger{36}.%M - %msg%n"

server.error.whitelabel.enabled: false
server.error.include-stacktrace: always
server.error.include-message: always
spring.mvc.format.date: iso
spring.mvc.format.date-time: iso
spring.mvc.format.time: iso
spring.jackson.date-format: yyyy-MM-dd HH:mm:ss
spring.output.ansi.enabled: always
spring-doc:
  packages-to-scan: com.bookstore.controller, com.bookstore.dto
spring.h2.console.enabled: true